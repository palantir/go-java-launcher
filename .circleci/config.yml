# To manually manage the CircleCI configuration for this project, remove the .circleci/template.sh file.

version: 2.1

orbs:
  go-jobs: palantir/go-jobs@0.8.0

image-version: &image-version "cimg/go:1.26.3-browsers"

executors:
  standard-executor:
    docker:
      - image: *image-version
    working_directory: /home/circleci/go/src/github.com/palantir/go-java-launcher
    resource_class: medium

# Filter that matches all tags (will run on every build).
all-tags-filter: &all-tags-filter
  filters:
    tags:
      only: /.*/

# Filter that matches any branch besides primary branch and ignores all tags except for release candidates
pull-request-filter: &pull-request-filter
  filters:
    tags:
      only: /.*-rc.*/
    branches:
      ignore:
        - develop

requires_jobs: &requires_jobs
  - build
  - verify
  - test
  - dist
  - trial-publish

jobs:
  trial-publish:
    working_directory: /home/circleci/go/src/github.com/palantir/go-java-launcher
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - restore_cache:
          name: "Restore gradle cache"
          keys:
            - gradle-v1-{{ checksum "gradlew" }}
      - go-jobs/restore_cache_with_mod_time:
          cache_dir: out/dist
      - run: ./gradlew publishToMavenLocal --no-configuration-cache --parallel --stacktrace --continue
      - save_cache:
          name: "Save gradle cache"
          key: gradle-v1-{{ checksum "gradlew" }}
          paths:
            - ~/.gradle
  publish:
    working_directory: /home/circleci/go/src/github.com/palantir/go-java-launcher
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - checkout
      - restore_cache:
          name: "Restore gradle cache"
          keys:
            - gradle-v1-{{ checksum "gradlew" }}
      - go-jobs/restore_cache_with_mod_time:
          cache_dir: out/dist
      - run: ./gradlew publish --no-configuration-cache --parallel --stacktrace --continue
      - save_cache:
          name: "Save gradle cache"
          key: gradle-v1-{{ checksum "gradlew" }}
          paths:
            - ~/.gradle

workflows:
  version: 2
  verify:
    jobs:
      - go-jobs/godel_build:
          name: "build"
          executor: "standard-executor"
          <<: *all-tags-filter
      - go-jobs/godel_verify:
          name: "verify"
          executor: "standard-executor"
          skip_tests: true
          requires:
            - build
          <<: *all-tags-filter
      - go-jobs/godel_test:
          name: "test"
          executor: "standard-executor"
          requires:
            - build
          <<: *all-tags-filter
      - go-jobs/godel_dist:
          name: "dist"
          executor: "standard-executor"
          requires:
            - build
          <<: *all-tags-filter
      - trial-publish:
          requires:
            - verify
            - test
            - dist
          <<: *all-tags-filter
      - publish:
          requires:
            - verify
            - test
            - dist
          filters:
            tags:
              only: /^v?[0-9]+(\.[0-9]+)+(-rc[0-9]+)?$/
            branches:
              ignore: /.*/
      - go-jobs/circle_all:
          name: "circle-all"
          image: "busybox:1.36.1"
          requires: *requires_jobs
          <<: *pull-request-filter
